[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armhpc-ota"
version = "1.2.1"
description = "ARMHPC signed, offline-root dual-system OTA engine"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
dependencies = ["cryptography>=38"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
armhpc_ota = ["profiles/*.json"]

[project.optional-dependencies]
publisher = ["zstandard>=0.23"]
