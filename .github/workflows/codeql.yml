# SPDX-License-Identifier: GPL-3.0-only
name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: CodeQL Python
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:python
  native:
    name: CodeQL Guardian
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: c-cpp
          build-mode: manual
      - run: gcc -O2 -Wall -Wextra boot/watchdog-guard.c -o "$RUNNER_TEMP/watchdog-guard"
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:c-cpp
  csharp:
    name: CodeQL CSharp
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build windows/ArmHpc.Ota.Windows/ArmHpc.Ota.Windows.csproj -c Release -p:RestoreLockedMode=true
      - run: dotnet build windows/ArmHpc.Ota.Cli/ArmHpc.Ota.Cli.csproj -c Release -p:RestoreLockedMode=true
      - run: dotnet build windows/ArmHpc.Ota.Server/ArmHpc.Ota.Server.csproj -c Release -p:RestoreLockedMode=true
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:csharp
