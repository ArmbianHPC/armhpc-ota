version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      action-updates:
        patterns: ["*"]
  - package-ecosystem: nuget
    directories:
      - /windows/ArmHpc.Ota.Cli
      - /windows/ArmHpc.Ota.Core
      - /windows/ArmHpc.Ota.Server
      - /windows/ArmHpc.Ota.Tests
      - /windows/ArmHpc.Ota.UiTests
      - /windows/ArmHpc.Ota.Windows
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dotnet-dependencies:
        patterns: ["*"]
